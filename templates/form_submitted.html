{% extends 'base.html' %}
{% block title %}Cafe Submitted{% endblock %}

{% block content %}

<div class="container mt-5 d-flex justify-content-center align-items-center">
  <div class="row">
    <div class="col-sm-12 text-white">
      {% if submit: %}
        <h1 class="text-white text-center">Your response has been submitted.</h1>
        <p class="space-above mt-3 text-center"><a href="{{ url_for('add_cafe') }}"> Submit another response.</a></p>
        <p class="space-above text-center"><a href="{{ url_for('cafes') }}">See all cafes</a></p>
      {% else %}
        <h1 class="text-white text-center">What are you doing here?</h1>
        <p class="space-above mt-3 text-center"><a href="{{ url_for('home') }}">Return to the homepage.</a></p>
      {% endif %}
    </div>
  </div>
</div>


{% endblock %}
